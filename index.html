*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0; font-family:var(--f-body); color:var(--ink); background:var(--canvas);

.plate,.hero-panel,.info-box,.promo-card,.repo-card,.exp-item{

.machine{max-width:960px; margin:0 auto; background:var(--canvas);

.masthead{display:flex; justify-content:space-between; align-items:center;

.mascot-bubble{display:flex; align-items:center; gap:var(--s-sm); background:var(--surface);

.bubble-text{font-family:var(--f-pixel); font-size:11px; color:var(--carbon);}

.nav-links{list-style:none; display:flex; gap:var(--s-lg); margin:0; padding:0; flex-wrap:wrap;}
.nav-link{background:none; border:none; cursor:pointer; color:var(--nav-gold);

.rail{min-width:0;}
.info-box{background:var(--surface); border-radius:var(--r-sm); padding:var(--s-md); margin-top:var(--s-md);}
.info-tab{background:var(--amber); color:var(--carbon); display:inline-block; font-size:11px;

.info-box .body-copy{padding:0;}
.promo-card{background:var(--lavender); border-radius:var(--r-sm); padding:var(--s-md); margin-top:var(--s-md); text-align:center;}
.exp-item{background:var(--platinum); border-radius:var(--r-sm); padding:var(--s-md); margin:0 var(--s-md);}
.exp-item h3{margin:0; font-size:13px; color:var(--ink-soft);}

.chip-list{list-style:none; display:flex; flex-wrap:wrap; gap:var(--s-sm); padding:var(--s-md); margin:0;}
.chip-list li{background:var(--surface); color:var(--ink); font-size:12px; padding:var(--s-xs) var(--s-md);

.repo-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:var(--s-md); padding:var(--s-md);}
.repo-card{background:var(--surface); border-radius:var(--r-sm); padding:var(--s-md); text-decoration:none;
  display:flex; flex-direction:column; gap:var(--s-xs);}
.repo-card:hover{background:var(--ice);}
.repo-card h4{margin:0; font-size:13px; color:var(--ink-soft); word-break:break-word;}
.repo-card p{margin:0; font-size:11px; line-height:1.4; color:var(--ink); flex:1;}
.repo-meta{display:flex; gap:var(--s-md); font-size:10px; color:var(--muted-indigo); font-weight:700;}
.repo-lang{display:inline-flex; align-items:center; gap:4px;}
.repo-lang::before{content:"\25CF"; color:var(--signal);}
.footer-bar{background:var(--carbon); color:var(--canvas-soft);

.esrb-badge{background:var(--amber); color:var(--carbon); padding:2px var(--s-sm); border-radius:var(--r-xs);}
.micro{font-size:10px; line-height:1.3;}
.tab-panel{display:none;}
.tab-panel.active{display:block; animation:fade .25s ease;}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
[data-lang="pt"] .lang-en{display:none;}
[data-lang="en"] .lang-pt{display:none;}
@media (max-width:760px){

  .nav-link{min-height:44px;}
  .btn-icon-arrow,.chip{min-height:44px; display:inline-flex; align-items:center;}
}

const lang = () => document.documentElement.getAttribute("data-lang");
const t = (key) => (I18N[lang()][key] !== undefined ? I18N[lang()][key] : key);
const loc = (v) => (v && typeof v === "object") ? (v[lang()] !== undefined ? v[lang()] : v.en) : v;

function applyI18n(){
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    el.textContent = t(el.getAttribute("data-i18n"));
  });
  document.documentElement.lang = lang()==="pt" ? "pt-BR" : "en";
  renderDynamic();
}
function itemCard(title, period, desc){
  return '<div class="exp-item"><h3>'+title+'</h3>'+
    '<div class="meta">'+(period||"")+'</div>'+
    (desc?('<p>'+desc+'</p>'):"")+'</div>';
}
function renderDynamic(){
  document.getElementById("expList").innerHTML =
    DATA.experience.map(function(e){return itemCard(loc(e.role)+" \u00b7 "+e.org, e.period, loc(e.desc));}).join("");
  document.getElementById("eduList").innerHTML =
    DATA.education.map(function(e){return itemCard(e.org, e.period, loc(e.role));}).join("");
  document.getElementById("certList").innerHTML =
    DATA.certifications.map(function(c){return "<li>"+c+"</li>";}).join("");
  document.getElementById("skillList").innerHTML =
    DATA.skills.map(function(s){return "<li>"+s+"</li>";}).join("");
  document.getElementById("pubList").innerHTML =
    DATA.publications.map(function(p){return itemCard(p.title, loc(p.period), loc(p.desc));}).join("");
  document.getElementById("awardList").innerHTML =
    DATA.awards.map(function(a){return itemCard(loc(a.org), a.period, loc(a.desc));}).join("");
}
document.querySelectorAll(".nav-link").forEach(function(btn){
  btn.addEventListener("click", function(){
    document.querySelectorAll(".nav-link").forEach(function(b){b.classList.remove("active");});
    document.querySelectorAll(".tab-panel").forEach(function(p){p.classList.remove("active");});
    btn.classList.add("active");
    document.getElementById("tab-"+btn.dataset.tab).classList.add("active");
    document.getElementById("navLinks").classList.remove("open");
    window.scrollTo({top:0,behavior:"smooth"});
  });
});
document.getElementById("navToggle").addEventListener("click", function(){
  document.getElementById("navLinks").classList.toggle("open");
});
document.getElementById("langToggle").addEventListener("click", function(){
  var next = lang()==="pt" ? "en" : "pt";
  document.documentElement.setAttribute("data-lang", next);
  localStorage.setItem("lang", next);
  applyI18n();
});
async function loadRepos(){
  var grid = document.getElementById("repoGrid");
  try{
    var res = await fetch("https://api.github.com/users/"+USERNAME+"/repos?per_page=100&sort=updated");
    if(!res.ok) throw new Error("GitHub API "+res.status);
    var repos = await res.json();
    repos = repos.filter(function(r){return !r.fork;})
      .sort(function(a,b){return (b.stargazers_count-a.stargazers_count) || (new Date(b.pushed_at)-new Date(a.pushed_at));})
      .slice(0,9);
    grid.innerHTML = repos.map(function(r){
      return '<a class="repo-card" href="'+r.html_url+'" target="_blank" rel="noopener">'+
        '<h4>'+r.name+'</h4>'+
        '<p>'+(r.description ? r.description : (lang()==="pt"?"Sem descri\u00e7\u00e3o.":"No description."))+'</p>'+
        '<div class="repo-meta">'+
          (r.language?('<span class="repo-lang">'+r.language+'</span>'):"")+
          '<span>\u2605 '+r.stargazers_count+'</span>'+
        '</div></a>';
    }).join("") || ('<p class="body-copy">'+(lang()==="pt"?"Nenhum reposit\u00f3rio p\u00fablico.":"No public repositories.")+'</p>');
  }catch(err){
    grid.innerHTML = '<p class="body-copy">'+
      (lang()==="pt"?"N\u00e3o foi poss\u00edvel carregar os reposit\u00f3rios agora. Veja em ":"Couldn't load repositories right now. See ")+
      '<a href="https://github.com/'+USERNAME+'" target="_blank" rel="noopener">github.com/'+USERNAME+'</a>.</p>';
  }
}
